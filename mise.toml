# Dev tools and tasks. Python and its dependencies are managed by uv.
[tools]
uv = "0.13"

[tasks.sync]
run = "uv sync"

[tasks.fmt]
run = ["uv run ruff format doge_alignment watch tests", "uv run ruff check --fix doge_alignment watch tests"]

[tasks.lint]
run = ["uv run ruff format --check doge_alignment watch tests", "uv run ruff check doge_alignment watch tests"]

[tasks.typecheck]
run = "uv run ty check"

[tasks.test]
run = "uv run pytest"

[tasks.test-container]
description = "Run the tests inside dogebot's Red image on yveltal (its ImageMagick, fonts and Wand)"
run = "scripts/test-container.sh"

[tasks.check]
depends = ["lint", "typecheck", "test", "test-container"]

[tasks.generate-client]
description = "Regenerate clients/media-preload-client from the live media-preload spec"
run = """
curl -fsS http://10.0.0.38:8125/openapi.json | jq . > clients/media-preload.openapi.json
uvx --from openapi-python-client==0.29.1 --with ruff openapi-python-client generate \
  --path clients/media-preload.openapi.json --config clients/openapi-python-client.yaml \
  --meta uv --output-path clients/media-preload-client --overwrite
rm -rf clients/media-preload-client/.ruff_cache
"""
