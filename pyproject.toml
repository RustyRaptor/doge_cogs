[project]
name = "doge-cogs"
version = "0.1.0"
description = "Redbot cogs for dogebot"
readme = "README.md"
authors = [
    { name = "Ziad Arafat", email = "anonymous0programmer@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # The Red that dogebot runs; cogs get discord.py, PyYAML etc. from it
    "red-discordbot==3.5.24",
    # doge_alignment/render.py (chart image, not wired up yet; needs ImageMagick)
    "wand>=0.6.13",
]


[dependency-groups]
dev = [
    "media-preload-client",
    # Red's pytest plugin imports pip
    "pip",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.17",
    "ty>=0.0.97",
]

[tool.uv]
# A collection of Red cogs, not an installable package: Red's Downloader
# installs each cog folder (and its info.json requirements) on its own.
package = false

[tool.uv.sources]
media-preload-client = { path = "clients/media-preload-client", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ty.src]
include = ["doge_alignment", "watch", "tests"]


[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 80
indent-width = 8

# Red 3.5 runs on Python 3.11
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E2",
    "E3",
    "E4",
    "E5",
    "E7",
    "E9",
    "F",
    "FAST",
    "ANN",
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    # "COM",
    "C4",
    "DTZ",
    "EM",
    "FIX",
    "INT",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "PIE",
    "RET",
    "SIM",
    "TID",
    "TC",
    "ARG",
    "PTH",
    "I",
    "C90",
    "N",
    "PERF",
    "D",
    "UP",
    "TRY",
]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
